<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f2eb"><title>Updating AI Prep…</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f2eb;color:#152033;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}.card{width:min(86vw,420px);background:#fffdf9;border:1px solid #e8ddd1;border-radius:28px;padding:28px;box-shadow:0 18px 50px rgba(35,26,17,.08);text-align:center}.dot{width:54px;height:54px;margin:0 auto 16px;border-radius:18px;background:linear-gradient(145deg,#ff6f61,#f3508b);display:grid;place-items:center;color:white;font-size:26px}h1{margin:0 0 8px;font-size:26px}p{margin:0;color:#7a7d83;line-height:1.5}.spinner{margin:20px auto 0;width:26px;height:26px;border:3px solid #eadfd4;border-top-color:#ff6f61;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><main class="card"><div class="dot">✓</div><h1>Updating AI Prep</h1><p>Clearing only the old website cache. Your study data stays on this device.</p><div class="spinner"></div></main><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(e){}setTimeout(()=>location.replace('./app-v3.html?fresh='+Date.now()),700);})();</script></body></html>
