<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f2eb"><title>AI Prep</title><style>html,body{margin:0;background:#f7f2eb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:520px;background:#fffdf9;border:1px solid #eadccf;border-radius:30px;padding:34px 26px;text-align:center;box-shadow:0 18px 50px rgba(50,36,23,.08)}.mark{width:68px;height:68px;margin:auto;border-radius:22px;background:linear-gradient(145deg,#ff7f73,#e6527f);color:white;display:grid;place-items:center;font-size:36px}.spin{width:32px;height:32px;border-radius:50%;border:4px solid #eadfd4;border-top-color:#ef6d69;margin:22px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><main><div class="card"><div class="mark">✓</div><h1>Opening fresh AI Prep</h1><p>Loading the newest app build without the old cached home page.</p><div class="spin"></div></div></main><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}const r=await fetch('./index.html?build=timer-v3-'+Date.now(),{cache:'reload'});const h=await r.text();document.open();document.write(h.replace('<head>','<head><base href="/repo1/">'));document.close();}catch(e){document.querySelector('.card').innerHTML='<h1>Could not refresh</h1><p>'+e.message+'</p>';}})();</script></body></html>
